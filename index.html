<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Portfólio de Henrique Nascimento, estudante de Engenharia de Software com foco em automação e dados."
    />
    <meta name="theme-color" content="#3f63ff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Henrique Nascimento | Automação e dados</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('theme') || 'null')
        var dark =
          s && s.state
            ? s.state.theme === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
