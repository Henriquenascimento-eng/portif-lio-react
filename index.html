<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Portfólio de Henrique Nascimento, estudante de Engenharia de Software com foco em automação e dados."
    />
    <meta name="theme-color" content="#f3f5fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1224" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Henrique Nascimento | Automação e dados" />
    <meta
      property="og:description"
      content="Projetos direto do GitHub, contato e um pouco sobre mim. Estudante de Engenharia de Software na FIAP."
    />
    <meta property="og:url" content="https://portif-lio-react-one.vercel.app/" />
    <meta property="og:locale" content="pt_BR" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Henrique Nascimento | Automação e dados</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('theme') || 'null')
        var dark =
          s && s.state
            ? s.state.theme === 'dark'
            : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
